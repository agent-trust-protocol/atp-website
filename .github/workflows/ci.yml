name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint-typecheck-build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so `next build` does not fail on
          # missing required env. Replace per-environment in deploys.
          BETTER_AUTH_SECRET: ci-placeholder-secret-please-override
          BETTER_AUTH_URL: http://localhost:3099
          NEXT_PUBLIC_APP_URL: http://localhost:3099

      - name: Upload .next build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js
          retention-days: 1

  playwright:
    name: Playwright smoke tests
    needs: lint-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test e2e/smoke.spec.ts
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-please-override
          BETTER_AUTH_URL: http://localhost:3099
          NEXT_PUBLIC_APP_URL: http://localhost:3099

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
