name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Build/runtime placeholders so next build + next start succeed in CI.
  # Replace per-environment in deploys; never use these secrets for real.
  BETTER_AUTH_SECRET: ci-placeholder-secret-please-override
  BETTER_AUTH_URL: http://localhost:3099
  NEXT_PUBLIC_APP_URL: http://localhost:3099

jobs:
  ci:
    name: Lint · Typecheck · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test e2e/smoke.spec.ts --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
